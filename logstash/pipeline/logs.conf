# logs.conf
# ---------------------------------------------------------------------------
# Fuente: LOG (data/raw/application.log) — datos semi-estructurados de texto
# plano, formato: "<timestamp> <nivel> [<servicio>] <mensaje> status=<n> tiempo_ms=<n>"
#
# Por que Logstash y no Python para esta fuente: parsear texto libre con
# grok/kv es exactamente el caso de uso para el que Logstash fue disenado
# (transporte + parseo en el mismo paso), y reescribir ese parseo a mano en
# Python (con expresiones regulares propias) duplicaria trabajo que Logstash
# ya resuelve con componentes probados.
#
# input.file:
#   sincedb_path => "/dev/null" hace que Logstash relea el archivo completo
#   en cada arranque del contenedor (util para repetir la demo). Esto NO
#   genera documentos duplicados en Elasticsearch porque el _id se calcula
#   con un hash (fingerprint) del contenido de la linea: reindexar la misma
#   linea sobrescribe el mismo documento en vez de crear uno nuevo.
# ---------------------------------------------------------------------------

input {
  file {
    path           => "/usr/share/logstash/data-sources/application.log"
    start_position => "beginning"
    sincedb_path   => "/dev/null"
  }
}

filter {
  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601:log_timestamp} %{LOGLEVEL:log_level}\s+\[%{WORD:service}\] %{GREEDYDATA:log_message}"
    }
    tag_on_failure => ["_grokparsefailure_logs"]
  }

  # promovemos el timestamp DE NEGOCIO (el que trae la linea de log) a
  # @timestamp; asi Kibana grafica por el momento real del evento, no por
  # el instante en que Logstash proceso la linea.
  date {
    match  => ["log_timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # extraemos status= y tiempo_ms= del mensaje sin escribir un segundo grok:
  # el filtro kv (key=value) es la herramienta correcta para este patron.
  kv {
    source       => "log_message"
    field_split  => " "
    include_keys => ["status", "tiempo_ms"]
  }

  mutate {
    convert      => { "status" => "integer" "tiempo_ms" => "integer" }
    add_field    => { "source" => "log" }
    remove_field => ["log_timestamp", "path", "host", "@version", "event"]
  }

  # id deterministico para idempotencia (ver comentario del input.file arriba)
  fingerprint {
    source => ["message"]
    target => "[@metadata][doc_id]"
    method => "SHA1"
  }

  # ingested_at = momento real de procesamiento (para medir latencia
  # aproximada del pipeline comparando contra @timestamp en Kibana)
  ruby {
    code => "event.set('ingested_at', Time.now.utc.strftime('%Y-%m-%dT%H:%M:%S.%3NZ'))"
  }
}

output {
  elasticsearch {
    hosts       => ["${ES_HOST}"]
    index       => "taller-logs-app"
    document_id => "%{[@metadata][doc_id]}"
  }
  # Descomentar para depurar en `docker compose logs -f logstash`:
  # stdout { codec => rubydebug }
}
