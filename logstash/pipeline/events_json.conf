# events_json.conf
# ---------------------------------------------------------------------------
# Fuente: JSON (data/raw/events.json) — datos semi-estructurados, un objeto
# JSON por linea (JSON Lines). Representa eventos de interaccion de usuario
# (login, click, view_product, purchase, etc.) generados en batch.
#
# codec "json_lines": cada linea del archivo se parsea como un objeto JSON
# independiente y sus campos pasan a ser campos del evento de Logstash
# directamente (sin necesidad de un filtro json adicional).
#
# El campo de origen se llama "event_time" (no "@timestamp") a proposito:
# @timestamp es un campo reservado de Logstash con un tipo interno especial
# (Timestamp), y depender de que el codec lo "adivine" automaticamente a
# partir de una clave JSON con ese nombre es un comportamiento menos
# explicito. Preferimos declarar el mapeo nosotros mismos con el filtro
# date, que es el patron estandar y mas predecible para promover un campo
# de negocio a @timestamp.
# ---------------------------------------------------------------------------

input {
  file {
    path           => "/usr/share/logstash/data-sources/events.json"
    start_position => "beginning"
    sincedb_path   => "/dev/null"
    codec          => "json_lines"
  }
}

filter {
  date {
    match  => ["event_time", "ISO8601"]
    target => "@timestamp"
  }

  mutate {
    add_field    => { "source" => "json" }
    remove_field => ["path", "host", "@version", "event", "event_time"]
  }

  ruby {
    code => "event.set('ingested_at', Time.now.utc.strftime('%Y-%m-%dT%H:%M:%S.%3NZ'))"
  }
}

output {
  elasticsearch {
    hosts       => ["${ES_HOST}"]
    index       => "taller-eventos-json"
    # event_id ya es unico por construccion (ver scripts/generate_sample_data.py)
    # -> lo usamos directo como _id, sin necesidad de fingerprint.
    document_id => "%{event_id}"
  }
}
