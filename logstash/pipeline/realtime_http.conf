# realtime_http.conf
# ---------------------------------------------------------------------------
# Fuente: Python Producer (near real-time) — python/producers/event_producer.py
# envia una "transaccion" sintetica via HTTP POST cada
# PRODUCER_INTERVAL_SECONDS (por defecto 5s).
#
# Por que input http y no Kafka/RabbitMQ: el input `http` viene incluido en
# la distribucion base de Logstash (sin plugins ni brokers adicionales). Es
# la eleccion correcta para el volumen y el proposito academico del taller
# (demostrar near real-time con latencia de segundos). Un broker de
# mensajeria seria la eleccion correcta en un escenario productivo con
# miles de eventos/seg y necesidad de garantias de entrega mas fuertes
# (se documenta como mejora futura en el README).
# ---------------------------------------------------------------------------

input {
  http {
    host  => "0.0.0.0"
    port  => 8080
    codec => "json"
  }
}

filter {
  # el productor envia primero un evento "warmup" solo para confirmar que
  # el input http ya esta cargado (ver wait_for_logstash_http() en
  # event_producer.py); ese evento nunca debe llegar a Elasticsearch.
  if [warmup] {
    drop {}
  }

  date {
    match  => ["event_time", "ISO8601"]
    target => "@timestamp"
  }

  mutate {
    add_field    => { "source" => "realtime" }
    remove_field => ["headers", "host", "@version", "event", "event_time"]
  }

  # ingested_at = momento real en que Logstash proceso el evento. Comparado
  # con @timestamp (momento en que el productor genero la transaccion), es
  # la evidencia concreta de la latencia end-to-end del flujo near real-time
  # (ver README, seccion de observabilidad, para como visualizar esta
  # diferencia en Kibana con un runtime field).
  ruby {
    code => "event.set('ingested_at', Time.now.utc.strftime('%Y-%m-%dT%H:%M:%S.%3NZ'))"
  }
}

output {
  elasticsearch {
    hosts       => ["${ES_HOST}"]
    index       => "taller-eventos-realtime"
    document_id => "%{transaccion_id}"
  }
}
