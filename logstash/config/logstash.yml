# logstash.yml
# ---------------------------------------------------------------------------
# Configuracion global del nodo de Logstash (no de un pipeline en particular).
#
# Decisiones:
#   - api.http.host: "0.0.0.0"
#       Host de bind de la API de monitoreo de Logstash (puerto 9600, usada
#       por nuestro healthcheck y por scripts/healthcheck_all.sh). NOTA: esta
#       opcion se llamaba "http.host" hasta Logstash 7.15; fue renombrada a
#       "api.http.host" en 7.16 y el nombre viejo fue completamente
#       eliminado (ya no solo deprecado) a partir de Logstash 9.x — usar
#       "http.host" aqui hace que el contenedor falle al arrancar con
#       "Setting 'http.host' doesn't exist".
#   - NO se define "path.config" aqui a proposito.
#       "path.config" es el mecanismo de PIPELINE UNICO (equivalente a pasar
#       `-f <ruta>` por linea de comandos): si se define, Logstash IGNORA
#       pipelines.yml por completo (se ve como el warning "Ignoring the
#       'pipelines.yml' file because command line options are specified") y,
#       si la ruta es un directorio, carga TODOS los archivos que encuentre
#       ahi -sin filtrar por extension- como un unico pipeline "main". Eso
#       activaria por accidente hasta el archivo de referencia
#       (mysql_jdbc.conf.reference), que depende de variables que no existen
#       en este contenedor. Este proyecto usa MULTIPLES pipelines nombrados
#       (ver logstash/config/pipelines.yml), asi que este setting se omite
#       deliberadamente para que pipelines.yml sea la unica fuente de verdad.
#   - xpack.monitoring.enabled: false
#       Para un taller de un solo nodo, el monitoreo de Elastic (que normalmente
#       envia metricas a un cluster de monitoreo separado) no aporta valor y
#       agrega configuracion y superficie de seguridad innecesarias. Se
#       desactiva a proposito.
#   - dead_letter_queue.enable: true
#       Si un documento no puede indexarse en Elasticsearch (p.ej. un conflicto
#       de mapping), en vez de perderse silenciosamente, Logstash lo guarda en
#       la Dead Letter Queue (DLQ) local para poder inspeccionarlo despues.
#       Es la respuesta concreta a "como sabemos que los datos llegaron
#       correctamente / que pasa si algo falla" pedida en el taller.
# ---------------------------------------------------------------------------

api.http.host: "0.0.0.0"

xpack.monitoring.enabled: false

dead_letter_queue.enable: true
path.dead_letter_queue: /usr/share/logstash/data/dead_letter_queue

log.level: info
